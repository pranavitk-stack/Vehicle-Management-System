<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER Diagram - Vehicle Service Management System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 0 0 8px 0;
            color: #38bdf8;
        }
        p {
            margin: 0 0 20px 0;
            color: #94a3b8;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            max-width: 95%;
            overflow: auto;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Entity-Relationship (ER) Diagram</h1>
    <p>Vehicle Service Management and Maintenance Analysis System</p>
    <div class="container">
        <img src="er_diagram.png" alt="ER Diagram">
    </div>
</body>
</html>
